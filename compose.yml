services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: reverse_proxy
    ports:
      - "80:8080"
    networks:
      - frontend_net
      - backend_net
    depends_on:
      - backend
    restart: unless-stopped
    read_only: true
    volumes:
      - /tmp
      - /var/cache/nginx
      - /var/run/nginx
    security_opt:
      - no-new-privileges:true

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: django_backend
    networks:
      - backend_net
      - db_net
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      - db
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  db:
    image: postgres:16-alpine
    container_name: postgres_db
    networks:
      - db_net
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
  db_net:
    driver: bridge
    internal: true

volumes:
  postgres_data: