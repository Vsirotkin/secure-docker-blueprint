# Защита от кликджекинга
add_header X-Frame-Options "SAMEORIGIN" always;

# Защита от MIME-sniffing (браузер не будет угадывать тип контента)
add_header X-Content-Type-Options "nosniff" always;

# Базовая защита от XSS (для старых браузеров)
add_header X-XSS-Protection "1; mode=block" always;

# Контроль над тем, какая информация передается в Referer
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Content Security Policy (базовая, разрешает только свои ресурсы)
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline';" always;

# Отключение ненужных функций браузера (геолокация, камера, микрофон)
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# HSTS: принудительное использование HTTPS (будет критично, когда добавим SSL)
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;