name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test and Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.12"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: |
          cd backend
          uv sync --extra dev

      - name: Run Ruff linting
        run: |
          cd backend
          uv run ruff check .

      - name: Run Ruff formatting check
        run: |
          cd backend
          uv run ruff format --check .

      - name: Run MyPy type checking
        run: |
          cd backend
          uv run mypy .

      - name: Run tests
        run: |
          cd backend
          uv run pytest -v

      - name: Run pip-audit
        run: |
          cd backend
          uv run pip-audit

  security:
    name: Security Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.0/gitleaks_8.18.0_linux_x64.tar.gz | tar xz
          sudo mv gitleaks /usr/local/bin/

      - name: Run Gitleaks
        run: gitleaks detect --source . --no-git -v

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin

      - name: Run Trivy vulnerability scan
        run: |
          trivy image --severity CRITICAL,HIGH secure-docker-blueprint-nginx:latest || true
          trivy image --severity CRITICAL,HIGH secure-docker-blueprint-backend:latest || true
          trivy image --severity CRITICAL,HIGH postgres:16-bookworm || true

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test, security]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build

      - name: Generate SBOM
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sudo sh -s -- -b /usr/local/bin
          mkdir -p sbom
          syft scan secure-docker-blueprint-nginx:latest -o cyclonedx-json > sbom/nginx-sbom.json
          syft scan secure-docker-blueprint-backend:latest -o cyclonedx-json > sbom/backend-sbom.json
          syft scan postgres:16-bookworm -o cyclonedx-json > sbom/postgres-sbom.json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-files
          path: sbom/
